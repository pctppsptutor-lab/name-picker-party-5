<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Name Picker Party — 30 games</title><link rel="canonical" href="https://pctppsptutor-lab.github.io/goi-ten-vui-nhon/GoiTenVuiNhon/"></head><body>
<!-- Default Vol: 5 -->
<p>Game đã được gộp vào Name Picker Party. <a id="continueLink" href="https://pctppsptutor-lab.github.io/goi-ten-vui-nhon/GoiTenVuiNhon/?game=g25">Mở game / Continue</a></p>
<script>const target = new URL('/goi-ten-vui-nhon/GoiTenVuiNhon/', location.protocol.startsWith('http') ? location.origin : 'https://pctppsptutor-lab.github.io');
target.search = location.search; target.hash = location.hash;
const game = target.searchParams.get('game');
target.searchParams.set('game', /^g(?:[1-9]|[12]\d|30)$/.test(game || '') ? game : "g25");
document.getElementById('continueLink').href = target.href;
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
location.replace(target.href);</script>
</body></html>
